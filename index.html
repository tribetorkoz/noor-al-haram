    <meta charset="UTF-8" />

    <title>Noor Al-Haram - Genius Hifz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-gold: #fbbf24;
        --color-deep: #020617;
        --color-accent: #0f172a;
      }
      body {
        font-family: 'Noto Kufi Arabic', sans-serif;
        background-color: var(--color-deep);
        color: #fff;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
      }
      .font-quran {
        font-family: 'Amiri Quran', serif;
        line-height: 2.5;
      }
      
      /* --- Focus Utilities --- */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 99px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(251, 191, 36, 0.4); }

      /* Smooth masking */
      .mask-linear-fade {
        mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
      }
      
      /* Audio Visualizer Bars */
      .bar {
        width: 3px;
        background: #fbbf24;
        border-radius: 99px;
        animation: equalizer 1s ease-in-out infinite;
      }
      .bar:nth-child(1) { animation-duration: 0.8s; height: 10px; }
      .bar:nth-child(2) { animation-duration: 0.7s; height: 15px; }
      .bar:nth-child(3) { animation-duration: 0.6s; height: 12px; }
      .bar:nth-child(4) { animation-duration: 0.9s; height: 14px; }
      
      @keyframes equalizer {
        0%, 100% { transform: scaleY(1); opacity: 0.5; }
        50% { transform: scaleY(1.5); opacity: 1; }
      }

      .paused .bar {
        animation-play-state: paused;
        opacity: 0.3;
        transform: scaleY(0.5);
        transition: all 0.3s;
      }
    </style>
