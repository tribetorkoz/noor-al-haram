<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noor Al-Haram - Genius Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-gold: #fbbf24;
        --color-deep: #000000;
      }
      body {
        font-family: 'Noto Kufi Arabic', sans-serif;
        background-color: var(--color-deep);
        color: #fff;
        overflow: hidden; /* App-like feel */
      }
      .font-quran {
        font-family: 'Amiri Quran', serif;
      }
      
      /* Cinematic Background */
      .cinematic-bg {
        background: radial-gradient(circle at 50% 120%, #1e1b4b 0%, #000000 60%);
        position: fixed;
        inset: 0;
        z-index: -1;
      }
      
      /* Noise overlay for texture */
      .noise {
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        z-index: -1;
        pointer-events: none;
      }

      /* Floating Dock Animation */
      @keyframes floatUp {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-dock {
        animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Audio Visualizer Bars */
      .bar {
        width: 6px;
        background: linear-gradient(to top, #fbbf24, #d97706);
        border-radius: 999px;
        animation: equalizer 1s ease-in-out infinite;
      }
      @keyframes equalizer {
        0%, 100% { height: 10px; opacity: 0.3; }
        50% { height: 40px; opacity: 1; }
      }
      
      /* Hide scrollbar for Stories bar */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Custom scrollbar for text areas */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
</head>
  <body>
    <div class="cinematic-bg"></div>
    <div class="noise"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
