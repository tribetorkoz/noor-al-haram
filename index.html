<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Noor Al-Haram - Premium Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-gold: #fbbf24;
        --color-deep: #020617;
      }
      body {
        font-family: 'Noto Kufi Arabic', sans-serif;
        background-color: var(--color-deep);
        color: #fff;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden; /* Prevent global scroll */
      }
      .font-quran {
        font-family: 'Amiri Quran', serif;
      }
      
      /* --- Living Aurora Background --- */
      .aurora-container {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: #000000;
        overflow: hidden;
      }
      .aurora-blob {
        position: absolute;
        filter: blur(90px);
        opacity: 0.35; /* Reduced opacity for better text contrast */
        animation: float 25s infinite alternate cubic-bezier(0.4, 0.0, 0.2, 1);
      }
      .blob-1 {
        top: -10%;
        left: -10%;
        width: 60vw;
        height: 60vw;
        background: radial-gradient(circle, #0f172a 0%, transparent 60%); /* Deeper Blue */
        animation-delay: -5s;
      }
      .blob-2 {
        bottom: -20%;
        right: -10%;
        width: 70vw;
        height: 70vw;
        background: radial-gradient(circle, #271a08 0%, transparent 60%); /* Darker Brown/Gold */
        animation-delay: 0s;
      }
      .blob-3 {
        top: 30%;
        left: 30%;
        width: 50vw;
        height: 50vw;
        background: radial-gradient(circle, #451a03 0%, transparent 60%); /* Dark Amber */
        opacity: 0.1;
        animation-duration: 40s;
      }
      
      @keyframes float {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(20px, 30px) scale(1.05); }
      }

      /* Noise overlay */
      .noise {
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        z-index: -1;
        pointer-events: none;
        mix-blend-mode: overlay;
      }

      /* --- Utilities --- */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 99px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(251, 191, 36, 0.4); }

      /* Masking for fading edges */
      .mask-linear-fade {
        mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
      }
      
      /* Glassmorphism Utilities */
      .glass-panel {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      }
      
      .text-glow {
        text-shadow: 0 0 40px rgba(251, 191, 36, 0.1);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^11.0.8"
  }
}
</script>
</head>
  <body>
    <div class="aurora-container">
      <div class="aurora-blob blob-1"></div>
      <div class="aurora-blob blob-2"></div>
      <div class="aurora-blob blob-3"></div>
    </div>
    <div class="noise"></div>
    <div id="root"></div>
  </body>
</html>
